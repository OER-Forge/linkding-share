[project]
name = "linkding-share"
version = "0.2.0"
description = "Terminal TUI for sharing and browsing linkding bookmarks"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "platformdirs>=4.9.6",
    "textual>=8.2.5",
    "trafilatura>=2.0.0",
]

[project.scripts]
linkding-share = "linkding_share.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkding_share"]
